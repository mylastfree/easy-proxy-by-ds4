name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读权限即可：CI 不写回仓库，也不需要访问 secrets
permissions:
  contents: read

jobs:
  test:
    name: 测试与校验
    runs-on: ubuntu-latest
    # 【R-6】本 job 跑七套测试 + 完整变异门禁（33 个变异）。
    #   实测：本机 33 项约 36 分钟；GitHub 上 25 项时实测 14–15 分钟，33 项按比例约 18–20 分钟。
    #   GitHub 默认 job 上限 6 小时，理论上不会超时；显式设定是为了在门禁被意外放大
    #   （例如变异数量翻倍）时【快速失败】，而不是让一个失控的 job 静默占用长达 6 小时的 runner。
    #   上限取 45 分钟：约为实测 CI 耗时的 2.3 倍余量，既不因 runner 抖动误杀，
    #   又在门禁翻倍时立刻暴露。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      # 【A2】Actions 固定到 commit SHA（供应链最小信任）：
      #   checkout@v4.2.2 = 11bd71901bbe5b1630ceea73d27597364c9af683
      #   setup-node@v4.4.0 = 49933ea5288caeca8642d1e84afbd3f7d6820020
      #   可变标签可能被上游劫持后指向任意代码；SHA 不可变，升级交给 dependabot。
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      # 【A1】静态 lint 作为 CI 的首个失败点（核心规则：no-undef / no-unused-vars 等；
      #   本仓库曾靠它抓到一处真实的块级作用域逃逸）。devDependencies 仅含 eslint 与
      #   c8（覆盖率），运行时依旧零依赖。
      # 【M-5·审计修复】npm install → npm ci：严格按 package-lock 安装，
      #   与「可复现」声明一致；lockfile 不同步时直接失败而不是静默解析新版本。
      - name: Lint（ESLint）
        run: |
          npm ci --no-fund --no-audit
          npm run lint

      # 【C-3·上线准入修复】依赖漏洞门禁。
      #   此前 dependabot 只覆盖 github-actions，本步骤又不存在，而 npm ci 还带着
      #   --no-audit —— npm 侧（eslint / c8 及其传递依赖）完全没有持续防线。
      #   运行时零依赖使风险面很小，但防线必须在流水线里：新增 CVE 时应当直接变红，
      #   而不是靠维护者记得手动跑一次。
      #   阈值取 high：moderate/low 多为开发工具的传递依赖噪音，不阻断发布。
      - name: 依赖漏洞审计（npm audit）
        run: npm audit --audit-level=high

      # 本项目运行时零依赖，无需额外安装 —— 直接跑测试
      - name: 语法校验
        run: |
          set -e
          for f in settings.js background.js popup.js; do
            node --check "$f"
            echo "OK   $f"
          done
          for f in tests/*.js; do
            node --check "$f"
            echo "OK   $f"
          done

      - name: 清单与文件引用校验
        run: node tests/manifest.test.js

      - name: 纯函数测试
        run: node tests/settings.test.js

      - name: 异步逻辑测试（并发竞态护栏）
        run: node tests/background.test.js

      - name: 修复安全性测试
        run: node tests/fix-safety.test.js

      - name: 并发护栏测试（N1/N2：暂停计数与测试互斥）
        run: node tests/concurrency.test.js

      - name: 所有权护栏（R3-01：生效配置，不是存储值）
        run: node tests/ownership.test.js

      - name: popup 交互测试（R7-08：异常必须复位按钮）
        run: node tests/popup.test.js

      # 【M-2·审计修复】发布产物的唯一来源必须在 CI 可复现：跑一次真实打包。
      #   dist/ 在 .gitignore 中，不会影响后续的「工作区洁净」核验。
      - name: 打包脚本自检（产物可复现）
        run: npm run package

      # 【M-4·审计修复】覆盖率度量：矩阵只跑一次（Node 22），不拖慢其余节点。
      - name: 覆盖率（c8，仅 Node 22）
        if: matrix.node-version == 22
        run: npm run coverage

      # 发布 tag 一致性（R3-02）：tag 触发时，tag 名必须与 manifest.version 完全对应。
      # 只校验，不创建也不移动 tag —— 创建正式 tag 属于发布动作。
      - name: 发布 tag 与版本一致性校验
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          VERSION=$(node -p "require('./manifest.json').version")
          EXPECTED="v$VERSION"
          ACTUAL="${GITHUB_REF_NAME}"
          echo "期望 tag: $EXPECTED；实际 tag: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::发布 tag($ACTUAL) 与 manifest.version($VERSION) 不一致，拒绝发布"
            exit 1
          fi
          echo "tag 与版本一致"

      - name: 变异测试（验证护栏测试真的会拦截回归）
        run: node tests/mutation-check.js

      # 变异测试会临时改写源文件；若未正确还原，后续步骤会失败。
      # 这里显式核验工作区洁净，守住这一约束。
      - name: 核验变异测试后工作区未被污染
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::变异测试后工作区存在改动，说明测试未正确还原文件"
            git status --porcelain
            exit 1
          fi
          echo "工作区洁净"

      - name: 汇总
        if: always()
        run: echo "Node ${{ matrix.node-version }} 全部检查完成"
