name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，而不只是描述想要的实现——同一问题的更优解法往往存在。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前的不便或缺口，而不是直接给方案
      placeholder: 例如：我经常在代理开与关之间切换，现在每次都要点两次
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 可选。如果你已有想法可以写在这里
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个建议主要涉及
      options:
        - 代理功能（协议、绕过规则、作用域）
        - 界面与交互
        - 连接测试
        - 工程化（测试、构建、文档）
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 本项目的两条硬约束，希望新功能不破坏它们
      options:
        - label: 我不要求引入第三方运行时依赖（本项目刻意保持零依赖）
          required: false
        - label: 我不要求新增 host 权限或读取网页内容的权限
          required: false
